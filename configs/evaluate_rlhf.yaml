# RLHF Model Evaluation Configuration
# Evaluates trained models on toxicity reduction using real-toxicity-prompts
# 
# Note: base_model references ${toxic_model} from full_pipeline.yaml
#       Set trained_model_root via CLI to specify which model to evaluate

evaluate_rlhf:

  model:
    base_model: ${toxic_model}  # Baseline for comparison (references global config)
    trained_model_root: null  # Set via CLI: HF repo or local path to checkpoint(s)
    checkpoint_epochs: [20, 40, 60, 80, 100]  # Epochs to evaluate
    
  # Dataset configuration  
  dataset:
    name: "allenai/real-toxicity-prompts"
    split: "train"
    profanity_threshold: 0.9
    n_prompts: 3700
    
  # Toxicity classifier
  toxicity:
    model: "s-nlp/roberta_toxicity_classifier"
    batch_size: 32
    max_length: 512
    
  # Generation parameters (will try to load from rlhf_config.yaml, these are fallbacks)
  generation:
    max_new_tokens: 64
    do_sample: true
    temperature: 1.0
    top_p: 0.85
    top_k: 0
    batch_size: 128
    
  # Evaluation settings
  evaluation:
    n_runs: 5  # Number of runs per model with different seeds
    seed_base: 42
    show_n_examples: 10  # Number of example completions to display
    
  # Output configuration
  output:
    save_dir: "outputs/rlhf_evaluation"
    save_results: true

