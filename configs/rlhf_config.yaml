# RLHF Training Configuration
# Use model groups to select different model configurations
# Override from CLI via: rlhf_config.model=<model_name>

defaults:
  - rlhf: meta-llama/Llama-3.2-1B   # Default model choice
  - _self_

# Hydra output directory
hydra:
  run:
    dir: ${oc.env:PWD}/outputs/rlhf/${now:%Y-%m-%d_%H-%M-%S}

# Training parameters
training:
  num_train_epochs: 100
  save_freq: 20
  eval_freq: 20
  seed: 42
  fast_start: true

  
  # Optional: VI training data paths for sanity checks
  original_dataset_path: null
  detoxified_dataset_path: null

# Output and Hub settings
output:
  push_to_hub: true
  push_checkpoints_to_hub: true
  checkpoint_push_freq: 20
  organization: null
  repository_name: "smolLM-360m-detox"
  private: false

# WandB logging
wandb:
  project: "irl_rlhf"
  entity: null
  name: null

# IRL reward configuration (optional - enable via CLI)
irl:
  irl_root: re_irl_min_stratified_plots
  posterior_dir: null
  global_norm_dir: null
  base_model_name: ${toxic_model}  # Auto-resolves: uses model.name if null
  use_round: 1
  sample_theta_each_step: true
  n_samples: 100
  feature_max_length: 256
  feature_batch_size: 16
  use_platt: false
  platt_a: 1.0
  platt_b: 0.0
  features_on_cpu: false  # use true for GPU memory efficiency
  reward_scale: 20
  reward_clip: 3

